# ===== 数据库自动备份 =====
# 是否启用自动备份
hr.backup.enabled=true
hr.backup.db.host=192.168.0.26
hr.backup.db.port=3306
hr.backup.db.username=${HR_DB_USERNAME:root}
hr.backup.db.password=${HR_DB_PASSWORD:}
# 备份文件根目录（应用服务器本地路径，Windows 用反斜杠盘符路径，目录勿含中文）
#   Windows 示例: hr.backup.dir=D:\\hr\\backup
hr.backup.dir=D:/hr/backup
# 保留的备份记录条数（超出的最旧备份会连同文件一起清除）
hr.backup.retention-count=15
# 自动备份小时（每天：1点 与 13点）
hr.backup.auto.hours=1,13
# mysqldump 可执行文件路径（Windows 填完整路径含 .exe；程序会自动为纯文件名补 .exe 后缀）
#   Windows 示例: hr.backup.mysqldump.path=C:\\Program Files\\MySQL\\MySQL Server 8.0\\bin\\mysqldump.exe
hr.backup.mysqldump.path=mysqldump

# 登录令牌有效期（小时），默认 8 小时
hrm.jwt.expire-hours=8
